<!DOCTYPE html>
<html>
<head>
  <title>Video Player</title>

  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    iframe {
      width: 90vw;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      border: none;
    }
  </style>

</head>

<body>

  <iframe
    src="https://www.youtube.com/embed/jZn8PR-GwmU?si=ukAzS23nkyp_1J2r"
    title="YouTube video player"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>

</body>
</html>
